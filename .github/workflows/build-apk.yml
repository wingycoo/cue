name: Build Android APK & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cue-notes.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue-notes-apk
          path: cue-notes.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cue-notes.apk
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "Cue Notes Android APK (${{ github.ref_name || 'v1.0.0' }})"
          body: |
            ## 📱 Cue Notes Android APK
            - 안드로이드 홈 화면 위젯 (Cue Notes Widget) 지원
            - 4x2 최신/고정 메모 프리뷰
            - 원클릭 퀵 메모 작성 버튼
            - 실시간 GCS 클라우드 동기화
            
            ### 설치 방법
            1. 스마트폰 브라우저에서 아래 `cue-notes.apk` 파일을 다운로드합니다.
            2. 다운로드 완료 후 파일을 터치하여 **[설치]**를 진행합니다.
            3. 홈 화면 빈 공간을 길게 눌러 **[위젯]** 목록에서 **Cue Notes 위젯**을 추가해 보세요!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
